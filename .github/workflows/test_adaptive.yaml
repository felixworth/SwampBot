name: Test adaptive bot (dry run)
on:
  workflow_dispatch:
concurrency:
  group: adaptive-bot-dry-run
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Reject leftover gpt-4o roster
        env:
          BOT_MODELS: ${{ vars.BOT_MODELS }}
        run: |
          python -c "import os,sys; m=os.environ.get('BOT_MODELS','').strip(); sys.exit('BOT_MODELS is missing or still uses gpt-4o') if (not m or 'gpt-4o' in m) else None"
      - name: Offline tests
        run: poetry run python -m unittest discover -s tests -v
      - name: Testing-area dry run (uses model credits, no submission)
        run: poetry run python run_adaptive.py --mode test_questions --limit 1
        env:
          METACULUS_TOKEN: ${{ secrets.METAC_API }}
          OPENROUTER_API_KEY: ${{ secrets.METAC_OPENR_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BOT_MODELS: ${{ vars.BOT_MODELS }}
          BOT_RESEARCHER: ${{ vars.BOT_RESEARCHER }}
          BOT_RESEARCH_FALLBACK: ${{ vars.BOT_RESEARCH_FALLBACK }}
          BOT_ENABLE_REVIEW: ${{ vars.BOT_ENABLE_REVIEW }}
          BOT_ENABLE_DURABLE_LOGGING: "true"
