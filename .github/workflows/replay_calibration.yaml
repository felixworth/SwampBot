name: Replay and fit calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Restore history
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" data || echo "no history yet"
      - name: Sync, build records, replay
        env:
          METACULUS_TOKEN: ${{ secrets.METAC_API }}
        run: |
          poetry run python scripts/sync_resolutions.py
          poetry run python scripts/build_replay_records.py --runs "data/runs/**/*.jsonl" --outcomes data/outcomes.jsonl --out data/replay_records.jsonl
          poetry run python scripts/replay_and_fit.py data/replay_records.jsonl --fit-stage after_anchor --out data/calibration.json | tee data/replay_report.txt
      - name: Push calibration
        if: always()
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          [ -d data/.git ] || exit 0
          cd data
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -A
          git commit -qm "weekly calibration" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*7)); done
          echo "::warning::calibration push failed"; exit 1
