name: Tournament forecast (off until the contest starts)

on:
  workflow_dispatch:
  # The contest has not started. Leave this commented out, and leave the
  # workflow disabled on GitHub, until the tournament opens.
  # schedule:
  #   - cron: "7,27,47 * * * *"

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Run the adaptive bot on the configured seasonal tournament and MiniBench.
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Restore history
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" data || echo "no history yet"
      - name: Reject leftover gpt-4o roster
        env:
          BOT_MODELS: ${{ vars.BOT_MODELS }}
        run: |
          python -c "import os,sys; m=os.environ.get('BOT_MODELS','').strip(); sys.exit('BOT_MODELS is missing or still uses gpt-4o') if (not m or 'gpt-4o' in m) else None"
      - name: Run bot
        run: |
          poetry run python run_adaptive.py --mode tournament --include-minibench --publish
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METAC_API }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.METAC_OPENR_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          BOT_MODELS: ${{ vars.BOT_MODELS }}
          BOT_RESEARCHER: ${{ vars.BOT_RESEARCHER }}
          BOT_RESEARCH_FALLBACK: ${{ vars.BOT_RESEARCH_FALLBACK }}
          BOT_TOURNAMENT_ID: ${{ vars.BOT_TOURNAMENT_ID }}
          BOT_ENABLE_REVIEW: ${{ vars.BOT_ENABLE_REVIEW }}
          BOT_ENABLE_DURABLE_LOGGING: "true"
          BOT_ENFORCE_SPEND_FLOOR: "true"
          BOT_SPEND_FLOOR_USD: "1"
      - name: Persist this run's log
        if: always()
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          [ -s logs/forecasts.jsonl ] || exit 0
          [ -d data/.git ] || git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" data
          dest="data/runs/$(date -u +%Y/%m/%d)"; mkdir -p "$dest"
          cp logs/forecasts.jsonl "$dest/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl"
          if [ -d logs/research ]; then mkdir -p data/research && cp -rn logs/research/. data/research/ || true; fi
          cd data
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -A
          git commit -qm "run ${GITHUB_RUN_ID}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*7)); done
          echo "::warning::log push failed after 5 attempts"; exit 1
      - name: Preserve private forecast logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-forecast-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 90