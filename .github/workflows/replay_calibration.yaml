name: Replay and fit calibration

on:
  workflow_dispatch:

concurrency:
  group: replay-calibration
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --no-root
      - name: Sync resolutions then replay
        env:
          METACULUS_TOKEN: ${{ secrets.METAC_API }}
        run: |
          poetry run python scripts/sync_resolutions.py logs/forecasts.jsonl
          poetry run python scripts/replay_and_fit.py logs/forecasts.jsonl --out calibration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-replay-${{ github.run_id }}
          path: |
            logs/
            calibration.json
          if-no-files-found: ignore
          retention-days: 90
